aid: boldstart-ventures
name: Boldstart Ventures
description: >-
  Boldstart Ventures ("the inception fund") is an early-stage venture firm that has written first checks
  for technical founders since 2010, backing enterprise and developer-first companies at inception, often
  before a company exists. It writes first checks from $500K to $15M and currently organizes its portfolio
  around cybersecurity, AI infrastructure, physical AI, agents and "weird" frontier bets. Its public fund
  announcements include Boldstart IV and Opportunity I ($157M) and Boldstart V and Opportunity II ($230M).
  Notable inception investments include Snyk (backed 2015), Clay (2017), BigID, SecurityScorecard,
  Superhuman (acquired by Grammarly), Protect AI (acquired by Palo Alto Networks), CrewAI, Tessl, Keycard
  and Generalist AI. The firm is led by founder Ed Sim with general partner Eliot Durbin and partner Ellen
  Chisa, and publishes Ed Sim's "What's Hot in Enterprise IT/VC" newsletter.
